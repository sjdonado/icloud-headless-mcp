# Build: every merge to main publishes installable tarballs, and every
# pull request runs the same checks before it can merge.
#
# Each main push builds one static icloud-mcp per Linux arch, stamps the
# commit into `icloud-mcp version`, and republishes the rolling `latest`
# GitHub Release. install.sh fetches those assets, so main is installable
# if and only if this workflow is green.
#
# Only the test job runs on pull requests: build and publish are main-only,
# because a pull request must never be able to publish a release.
name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref on pull requests only. A main
# push is never cancelled: it is the run that publishes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /dev/null ./cmd/icloud-mcp
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o /dev/null ./cmd/icloud-mcp

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          go build -trimpath -buildvcs=false -ldflags "-X main.version=$VERSION" \
            -o dist/icloud-mcp ./cmd/icloud-mcp
      - name: package
        run: |
          : "${VERSION:?VERSION empty}"
          name="icloud-headless-mcp-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name/bin" "dist/$name/systemd" "dist/$name/sudoers.d"
          cp dist/icloud-mcp "dist/$name/bin/icloud-mcp"
          cp stdio.sh "dist/$name/bin/stdio.sh"
          cp bin/agent-reask-access bin/icloud-mcp-host "dist/$name/bin/"
          cp systemd/* "dist/$name/systemd/"
          cp sudoers.d/* "dist/$name/sudoers.d/"
          cp .env.example LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name" dist/icloud-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The workflow default is read-only so a pull request cannot publish;
    # this job is the one that needs to write, and it only runs on main.
    permissions:
      contents: write
    concurrency:
      group: rolling-release
      cancel-in-progress: false
    steps:
      # gh release create resolves --target through git, so this job needs
      # the repo checked out (push-event tip == the target SHA; full history
      # so a re-run behind a newer push still has the pinned object).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > sha256sums.txt
      - name: republish rolling release
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest --latest --target "${{ github.sha }}" \
            --title "latest" \
            --notes "Rolling build of main @ ${{ github.sha }} (\`icloud-mcp version\` prints the short form). One static binary per Linux arch plus the wrapper, units, and sudoers files install.sh lays down. See README for the installer command." \
            dist/*.tar.gz dist/sha256sums.txt
        env:
          GH_TOKEN: ${{ github.token }}
